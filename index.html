<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Complete the Words 练习工具</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <aside class="panel">
          <div class="brand">
            <div>
              <h1>Complete the Words</h1>
              <p>新托福阅读词汇练习</p>
            </div>
            <span id="wordTotal" class="pill">加载中</span>
          </div>

          <form id="setupForm" class="setup">
            <label>
              起始序号
              <input id="startIndex" type="number" min="1" value="1" required />
            </label>
            <label>
              练习数量
              <input id="practiceCount" type="number" min="1" value="100" required />
            </label>
            <label>
              显示释义
              <select id="hintMode">
                <option value="none">不显示</option>
                <option value="cn">中文释义</option>
                <option value="en">英文释义</option>
                <option value="both">中英释义</option>
              </select>
            </label>
            <div class="actions">
              <button type="submit" class="primary">开始练习</button>
              <button type="button" id="resumeBtn">继续上次</button>
            </div>
          </form>

          <div class="stats">
            <div><strong id="doneStat">0</strong><span>已答</span></div>
            <div><strong id="correctStat">0</strong><span>正确</span></div>
            <div><strong id="accuracyStat">0%</strong><span>正确率</span></div>
          </div>

          <section class="history">
            <div class="section-title">
              <h2>本机练习记录</h2>
              <button type="button" id="clearHistoryBtn">清空</button>
            </div>
            <div id="historyList" class="history-list"></div>
          </section>
        </aside>

        <section class="practice">
          <div class="topbar">
            <div>
              <span id="rangeLabel">请选择练习范围</span>
              <h2 id="progressLabel">未开始</h2>
            </div>
            <button type="button" id="finishBtn">交卷</button>
          </div>

          <div id="emptyState" class="empty-state">
            <h2>选择练习范围后开始</h2>
            <p>系统会抽取指定范围的单词并乱序呈现，每个单词都放在原词表例句中进行挖空练习。</p>
          </div>

          <div id="quizCard" class="quiz-card hidden">
            <form id="answerForm" class="inline-answer">
              <div class="word-line" id="promptText" role="button" tabindex="0" aria-label="阅读例句并填写单词缺失字母"></div>
              <input id="answerInput" class="capture-input" type="text" autocomplete="off" spellcheck="false" />
              <button type="submit" class="primary">提交</button>
            </form>
            <div id="hintText" class="hint"></div>
            <div id="feedback" class="feedback"></div>
            <div class="nav-row">
              <button type="button" id="prevBtn">上一题</button>
              <button type="button" id="showAnswerBtn">显示答案</button>
              <button type="button" id="nextBtn">下一题</button>
            </div>
          </div>

          <section class="answer-sheet">
            <div class="section-title">
              <h2>答题卡</h2>
              <span id="sheetSummary">0 题</span>
            </div>
            <div id="answerGrid" class="answer-grid"></div>
          </section>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
